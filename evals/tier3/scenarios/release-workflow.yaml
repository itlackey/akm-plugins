id: release-workflow
description: User wants to cut a release; both the bump-version command and the release workflow should surface, and feedback should fire after use.
plugins: [claude, opencode]
seed_stash: default
user_turns:
  - role: user
    content: "Cut a new semver release and publish — bump version everywhere and tag the release."
expectations:
  must_curate_refs:
    - commands/bump-version
    - workflows/release
  may_curate_refs: []
  must_record_feedback_for:
    - commands/bump-version
    - workflows/release
  forbid_refs:
    - env/staging.env
  max_total_tokens: 8000
judge_rubric: strict
weight: 1.5
