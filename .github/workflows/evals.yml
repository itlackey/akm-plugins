name: Evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run: tier2 (deterministic) or tier3 (LLM judge)"
        required: false
        type: choice
        options: [tier2, tier3]
        default: tier2
      scenarios:
        description: "Tier-3 scenario glob (e.g. 'curate-skill-*'). Empty = all."
        required: false
        type: string
        default: ""
      budget_usd:
        description: "Tier-3 budget cap in USD"
        required: false
        type: string
        default: "5"

permissions:
  contents: read
  pull-requests: write

jobs:
  tier2:
    if: github.event_name != 'workflow_dispatch' || inputs.tier == 'tier2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install opencode deps (needed for harness imports)
        working-directory: opencode
        run: bun install --frozen-lockfile

      - name: Install evals deps (yaml, anthropic SDK)
        working-directory: evals
        run: bun install --frozen-lockfile

      - name: Run tier-2 evals against checked-in baseline
        id: tier2
        working-directory: evals
        run: |
          set +e
          bun tier2/runner.ts --baseline tier2/baseline/tier2.json --out ../eval-results/ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-${{ github.run_id }}
          path: eval-results/ci/

      - name: Comment diff on PR
        # Fork PRs get a read-only GITHUB_TOKEN with no issue/PR-comment
        # permission, so this step would otherwise fail the job on every
        # external contribution. Only run it for same-repo PRs, where the
        # token has write access.
        if: github.event_name == 'pull_request' && always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = 'eval-results/ci/diff.md'
            if (!fs.existsSync(path)) {
              core.warning('No diff.md produced; skipping PR comment.')
              return
            }
            const body = `<!-- akm-evals -->\n${fs.readFileSync(path, 'utf8')}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const prior = comments.find((c) => c.body && c.body.startsWith('<!-- akm-evals -->'))
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      # The tier3 job below is workflow_dispatch-only, so ~1,700 lines of
      # scenario harness never executed on a normal PR and rotted unnoticed.
      # `--no-judge --agent stub` drives every scenario through the real
      # plugin-invocation harness — the part that rots — with no judge call, no
      # ANTHROPIC_API_KEY and therefore zero API spend. It is a wiring smoke
      # test, NOT an effectiveness measurement: stub transcripts are
      # mechanically derived from each scenario's own expectations.
      #
      # always() so a tier-2 regression above does not hide a broken tier-3
      # harness; the two failures are independent signals.
      - name: Smoke-test the tier-3 harness (stub agent, no judge, no API cost)
        if: always()
        working-directory: evals
        run: bun tier3/runner.ts --no-judge --agent stub --out ../eval-results/tier3-smoke

      # `always()` so the tier-3 smoke step above still runs when tier-2
      # regresses. The exit_code check is written to distinguish "the runner
      # exited non-zero" from "the runner died before writing its output" —
      # a bare `!= '0'` is TRUE for the empty string, which reported a
      # regression with a blank code for what was actually a crashed step.
      - name: Fail job on regression
        if: always() && (steps.tier2.outputs.exit_code == '' || steps.tier2.outputs.exit_code != '0')
        run: |
          if [ -z "${{ steps.tier2.outputs.exit_code }}" ]; then
            echo "tier-2 evals did not report an exit code — the step failed before finishing"
          else
            echo "tier-2 evals exited with code ${{ steps.tier2.outputs.exit_code }}"
          fi
          exit 1

  tier3:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'tier3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install opencode deps
        working-directory: opencode
        run: bun install --frozen-lockfile

      - name: Install evals deps
        working-directory: evals
        run: bun install --frozen-lockfile

      - name: Run tier-3 scenarios with judge
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--budget ${{ inputs.budget_usd }} --out ../eval-results/tier3"
          if [ -n "${{ inputs.scenarios }}" ]; then
            ARGS="$ARGS --scenarios ${{ inputs.scenarios }}"
          fi
          bun tier3/runner.ts $ARGS

      - name: Upload tier-3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-${{ github.run_id }}
          path: eval-results/tier3/
