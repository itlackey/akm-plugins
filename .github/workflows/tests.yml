name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install claude plugin deps
        working-directory: claude
        run: bun install --frozen-lockfile

      - name: Install opencode plugin deps
        working-directory: opencode
        run: bun install --frozen-lockfile

      - name: Typecheck claude plugin
        working-directory: claude
        run: bun run typecheck

      - name: Typecheck opencode plugin
        working-directory: opencode
        run: bun run typecheck

      - name: Run unit tests
        run: bun test tests/

      # The real Codex, started offline against this checkout's plugin (tests/real-hosts.test.ts): no login and no
      # model call. Pinned so a run can be compared with the last one, and the same version as the windows job below
      # and release.yml (tests/version-policy.test.ts keeps them together).
      - name: Install Codex with npm
        run: |
          prefix="$RUNNER_TEMP/hosts-npm"
          npm install @openai/codex@0.160.0 --prefix "$prefix" --no-audit --no-fund
          codex="$(find "$prefix/node_modules" -type f -name codex -path '*/vendor/*' | head -n 1)"
          "$codex" --version
          echo "AKM_REAL_CODEX_BIN=$codex" >> "$GITHUB_ENV"

      - name: Run the real Codex
        run: bun test --timeout 300000 tests/real-hosts.test.ts

  # The hooks also run on Windows (see claude/README.md, "Windows"). This job runs the
  # hook-side tests there: the manifests' own commands, executed the way each host
  # executes them (Claude Code spawns `bun` with no shell; Codex hands the Windows
  # command to PowerShell or cmd.exe), against a fake akm that is akm.cmd. Tests that
  # need a POSIX sh fake are skipped by name; see tests/host-runtime.ts. The OpenCode
  # plugin and the real-akm contract test are not hook tests and stay on Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # npm's own shims for akm (akm.cmd beside an extensionless sh script), so the
      # hook is also run against the real thing rather than only against the fake.
      - name: Install akm-cli with npm
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "akm-npm"
          npm install akm-cli@0.9.25 --prefix $prefix --omit=optional --ignore-scripts --no-audit --no-fund
          "AKM_REAL_NPM_BIN=$(Join-Path $prefix 'node_modules/.bin')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run hook tests
        run: bun test --timeout 60000 tests/claude-plugin.test.ts tests/codex-plugin.test.ts tests/hook-commands.test.ts tests/akm-version-check.test.ts tests/ref-extraction.test.ts tests/ref-resolver-contract.test.ts tests/learning-signals.test.ts tests/recall-policy.test.ts tests/redaction.test.ts tests/vendor-semver.test.ts tests/version-policy.test.ts

      # The real hosts, started offline against this checkout's plugin (tests/real-hosts.test.ts):
      # no login and no model call. `claude -p` runs its SessionStart, UserPromptSubmit and SessionEnd
      # hooks and stops at "Not logged in"; `codex exec` runs its two hooks and its model provider is a
      # dead local port. Versions are pinned so a run can be compared with the last one.
      - name: Install Claude Code and Codex with npm
        shell: pwsh
        run: |
          node --version
          $prefix = Join-Path $env:RUNNER_TEMP "hosts-npm"
          npm install @anthropic-ai/claude-code@2.1.286 @openai/codex@0.160.0 --prefix $prefix --no-audit --no-fund
          $claude = Join-Path $prefix 'node_modules/@anthropic-ai/claude-code/bin/claude.exe'
          $codex = (Get-ChildItem (Join-Path $prefix 'node_modules') -Recurse -Filter codex.exe | Where-Object { $_.FullName -match 'vendor' } | Select-Object -First 1).FullName
          & $claude --version
          & $codex --version
          "AKM_REAL_CLAUDE_BIN=$claude" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AKM_REAL_CODEX_BIN=$codex" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run the real hosts
        run: bun test --timeout 300000 tests/real-hosts.test.ts
