name: Release

on:
  workflow_dispatch:
    inputs:
      akm_version:
        description: "The exact akm CLI compatibility floor these plugins target. For akm 0.10+ (e.g. 0.10.26101001) the plugins release as 0.10.<UTC YYMMDD><NN>, NN being the next free build of the day; a stage (e.g. 0.10.26101001-alpha, already on npm) makes it a `next` release with the same stage. For akm 0.9 (e.g. 0.9.30) the version is <akm_version><UTC yyyymmddhhmm>, or <akm_version>.<UTC yyyymmddhhmm> for a prerelease (e.g. 0.9.31-alpha.4). You never type the date."
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2

      - name: Install claude deps
        working-directory: claude
        run: bun install --frozen-lockfile

      - name: Install opencode deps
        working-directory: opencode
        run: bun install --frozen-lockfile

      - name: Install evals deps
        working-directory: evals
        run: bun install --frozen-lockfile

      - name: Typecheck claude plugin
        working-directory: claude
        run: bun run typecheck

      - name: Typecheck opencode plugin
        working-directory: opencode
        run: bun run typecheck

      - name: Run integration tests
        run: bun test tests/

      # The real Codex, offline, against this checkout's plugin (tests/real-hosts.test.ts): no login and no model call.
      # The version tests.yml pins (tests/version-policy.test.ts keeps them together).
      - name: Install Codex with npm
        run: |
          prefix="$RUNNER_TEMP/hosts-npm"
          npm install @openai/codex@0.160.0 --prefix "$prefix" --no-audit --no-fund
          codex="$(find "$prefix/node_modules" -type f -name codex -path '*/vendor/*' | head -n 1)"
          "$codex" --version
          echo "AKM_REAL_CODEX_BIN=$codex" >> "$GITHUB_ENV"

      - name: Run the real Codex
        run: bun test --timeout 300000 tests/real-hosts.test.ts

      - name: Run tier-2 evals against checked-in baseline
        working-directory: evals
        run: bun tier2/runner.ts --baseline tier2/baseline/tier2.json --out ../eval-results/release

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.derive.outputs.version }}
      next: ${{ steps.derive.outputs.next }}
      tag: ${{ steps.tag.outputs.tag }}
      tag_exists: ${{ steps.tag.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      # Derive the release version, then fail before anything is written.
      #
      # The operator supplies only the akm CLI version these plugins target;
      # scripts/release-version.ts (tested in tests/release-version.test.ts)
      # derives the rest from the UTC clock. That is deliberate: the two
      # releases before the derived scheme were typed by hand as
      # 0.9.202808211043 and 0.9.202808220049, and BOTH carry a typo'd year
      # (2028, not 2026). npm compares PATCH numerically, so a later,
      # correctly-dated hand-typed release would have sorted BELOW them and
      # silently never become `latest`. Removing the human from the date
      # removes that whole failure class.
      #
      # akm 0.10 and later (akm#1089): akm versions are daily builds,
      # 0.10.YYMMDDNN with -alpha/-beta/-rc for a prerelease. The plugins use
      # the same shape with their own counter: 0.10.<UTC YYMMDD><NN>[-stage],
      # NN one above the highest akm-opencode build already on npm that day,
      # the stage copied from akm_version. A stage is a `next` release.
      #
      # akm 0.9 (the old scheme, still releasable): <akm_version><yyyymmddhhmm>,
      # e.g. akm 0.9.1 at 2026-08-24 20:12 UTC -> 0.9.1202608242012. A
      # prerelease akm_version (0.9.31-alpha.4) is a `next` release instead:
      # <akm_version>.<yyyymmddhhmm>, 0.9.31-alpha.4.202610080512, a valid
      # semver prerelease. That scheme stops at 0.10: 26101001 followed by 12
      # digits is 20 digits, above Number.MAX_SAFE_INTEGER, which node-semver
      # rejects.
      #
      # A `next` release publishes under the npm `next` tag, and nothing is
      # committed to main.
      - name: Derive release version
        id: derive
        env:
          AKM_VERSION: ${{ inputs.akm_version }}
        run: bun scripts/release-version.ts derive >> "$GITHUB_OUTPUT"

      # Four rules, all checked before the tag exists (npm would otherwise be
      # the first thing to reject a bad version, by which point the tag is
      # already pushed): the supplied akm version must be plain semver and
      # exactly match the Claude compatibility floor, OpenCode must exact-pin
      # that same version, and the derived version must sort ABOVE whatever npm
      # currently calls `latest`.
      #
      # A `next` release changes three of them: the akm prerelease must only
      # share the floor's minor line and not fall below its patch (the floor
      # stays at the stable line), the pin is set in the build and not read
      # from main, so instead akm-cli@<akm_version> must already be on npm, and
      # the version must sort above whatever npm calls `next`.
      - name: Validate release version
        env:
          AKM_VERSION: ${{ steps.derive.outputs.akm_version }}
          VERSION: ${{ steps.derive.outputs.version }}
          NEXT: ${{ steps.derive.outputs.next }}
        run: |
          node <<'EOF'
          const fs = require('fs')
          const { execFileSync } = require('child_process')

          const akmVersion = process.env.AKM_VERSION
          const version = process.env.VERSION
          const next = process.env.NEXT === 'true'
          const source = fs.readFileSync('claude/shared/akm-version.ts', 'utf8')
          const opencodePackage = JSON.parse(fs.readFileSync('opencode/package.json', 'utf8'))
          const range = /AKM_VERSION_RANGE\s*=\s*"([^"]+)"/.exec(source)?.[1]
          if (!range) {
            console.error('Could not read AKM_VERSION_RANGE from claude/shared/akm-version.ts')
            process.exit(1)
          }

          const SEMVER = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/
          const parsedAkm = SEMVER.exec(akmVersion)
          if (!parsedAkm) {
            console.error(`akm_version "${akmVersion}" is not valid semver (MAJOR.MINOR.PATCH).`)
            console.error('Supply the exact akm CLI version these plugins target, e.g. 0.9.30 -- the workflow appends the timestamp.')
            process.exit(1)
          }

          const parsed = SEMVER.exec(version)
          if (!parsed) {
            console.error(`Derived version "${version}" is not valid semver. npm rejects anything else on publish, and this job tags before it publishes.`)
            process.exit(1)
          }

          const floor = SEMVER.exec(range.replace(/^[\^~>=v\s]+/, ''))
          if (!floor) {
            console.error(`AKM_VERSION_RANGE "${range}" has no parseable floor; expected a caret range like ^0.9.0.`)
            process.exit(1)
          }

          const floorVersion = `${floor[1]}.${floor[2]}.${floor[3]}`
          if (next) {
            // Claude's range check judges the release core, so an akm prerelease
            // satisfies ^0.9.30 exactly when its core does.
            if (parsedAkm[1] !== floor[1] || parsedAkm[2] !== floor[2] || Number(parsedAkm[3]) < Number(floor[3])) {
              console.error(`akm_version "${akmVersion}" is outside AKM_VERSION_RANGE ${range}: its release core must be ${floor[1]}.${floor[2]}.${floor[3]} or later on the ${floor[1]}.${floor[2]} line.`)
              process.exit(1)
            }
          } else if (akmVersion !== floorVersion) {
            console.error(`akm_version "${akmVersion}" does not equal AKM_VERSION_RANGE floor "${floorVersion}" (${range}).`)
            console.error('Move AKM_VERSION_RANGE first and validate that exact CLI version before publishing.')
            process.exit(1)
          }

          // OpenCode imports akm-cli's private dist modules in process. A
          // caret range would let the same plugin release execute different,
          // untested private APIs on different machines, so it must exact-pin
          // the tested floor. Claude only shells out through public CLI verbs
          // and deliberately retains the stable caret range.
          const opencodeAkm = opencodePackage.dependencies?.['akm-cli']
          if (next) {
            // The build pins this exact prerelease, so it has to be installable.
            try {
              execFileSync('npm', ['view', `akm-cli@${akmVersion}`, 'version'], { encoding: 'utf8', stdio: 'pipe' })
            } catch {
              console.error(`akm-cli@${akmVersion} is not on npm. Publish that akm prerelease first; the OpenCode build exact-pins it.`)
              process.exit(1)
            }
          } else if (opencodeAkm !== akmVersion) {
            console.error(`opencode/package.json must exact-pin akm-cli to "${akmVersion}"; found "${opencodeAkm ?? '<missing>'}".`)
            process.exit(1)
          }

          // Monotonicity guard. This is the check the hand-typed scheme never
          // had: publishing a version that sorts below `latest` succeeds on npm
          // and silently leaves `latest` pointing at the OLDER release, so every
          // consumer keeps installing the previous build.
          //
          // A `next` release is held to the same rule against the `next` tag,
          // which is where its prerelease versions are compared (semver order:
          // a prerelease sorts below its core, identifiers compared in turn).
          const channel = next ? 'next' : 'latest'
          let published = ''
          try {
            published = execFileSync('npm', ['view', 'akm-opencode', `dist-tags.${channel}`], { encoding: 'utf8' }).trim()
          } catch {
            console.log(`No published akm-opencode ${channel} version to compare against; skipping the monotonicity check.`)
          }
          if (published) {
            const prev = SEMVER.exec(published)
            if (!prev) {
              console.error(`Published version "${published}" is not plain semver; cannot compare. Investigate before releasing.`)
              process.exit(1)
            }
            const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0)
            const compare = (a, b) => {
              for (const i of [1, 2, 3]) {
                if (Number(a[i]) !== Number(b[i])) return cmp(Number(a[i]), Number(b[i]))
              }
              const pa = a[4]?.split('.')
              const pb = b[4]?.split('.')
              if (!pa || !pb) return pa ? -1 : pb ? 1 : 0
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const [x, y] = [pa[i], pb[i]]
                if (x === undefined || y === undefined) return x === undefined ? -1 : 1
                const numeric = /^\d+$/.test(x) && /^\d+$/.test(y)
                const order = numeric ? cmp(Number(x), Number(y)) : /^\d+$/.test(x) ? -1 : /^\d+$/.test(y) ? 1 : cmp(x, y)
                if (order !== 0) return order
              }
              return 0
            }
            if (compare(parsed, prev) <= 0) {
              console.error(`Derived version "${version}" does NOT sort above the published ${channel} "${published}".`)
              console.error(`npm would accept the publish and leave \`${channel}\` on the older release. Refusing.`)
              process.exit(1)
            }
            console.log(`${version} sorts above the published ${channel} ${published}.`)
          }

          console.log(`Version ${version} is valid semver; Claude targets ${range} and OpenCode exact-pins akm-cli ${next ? akmVersion : opencodeAkm}.`)
          EOF

      - name: Bump versions
        run: |
          VERSION="${{ steps.derive.outputs.version }}"
          VERSION="$VERSION" node <<'EOF'
          const fs = require('fs')

          const version = process.env.VERSION
          const updateJsonFile = (file, transform) => {
            const current = JSON.parse(fs.readFileSync(file, 'utf8'))
            const next = transform(current)
            fs.writeFileSync(file, `${JSON.stringify(next, null, 2)}\n`)
          }

          updateJsonFile('opencode/package.json', (pkg) => ({ ...pkg, version }))
          updateJsonFile('claude/package.json', (pkg) => ({ ...pkg, version }))
          updateJsonFile('claude/.claude-plugin/plugin.json', (plugin) => ({ ...plugin, version }))
          updateJsonFile('claude/.codex-plugin/plugin.json', (plugin) => ({ ...plugin, version }))
          updateJsonFile('.claude-plugin/marketplace.json', (marketplace) => ({
            ...marketplace,
            plugins: marketplace.plugins.map((plugin, index) => index === 0 ? { ...plugin, version } : plugin),
          }))
          EOF

      # `next` only: OpenCode imports akm's dist in process, so its build pins
      # the exact akm prerelease. The pin and the regenerated lockfile live in
      # the tagged commit alone, never on main, where the pin stays at the floor.
      - name: Pin akm-cli to the akm prerelease
        if: ${{ steps.derive.outputs.next == 'true' }}
        working-directory: opencode
        env:
          AKM_VERSION: ${{ steps.derive.outputs.akm_version }}
        run: |
          npm pkg set "dependencies.akm-cli=$AKM_VERSION"
          bun install
          bun run typecheck

      - name: Commit and tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude/package.json opencode/package.json claude/.claude-plugin/plugin.json claude/.codex-plugin/plugin.json .claude-plugin/marketplace.json

          if [ "${{ steps.derive.outputs.next }}" = "true" ]; then
            # Committed locally and reachable only from the tag; main is not pushed.
            git add opencode/bun.lock
            git commit -m "chore: next build ${{ steps.derive.outputs.version }}"
          elif ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.derive.outputs.version }}"
            git push
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.derive.outputs.version }}" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            git tag "v${{ steps.derive.outputs.version }}"
            git push origin "v${{ steps.derive.outputs.version }}"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=v${{ steps.derive.outputs.version }}" >> "$GITHUB_OUTPUT"

  publish-opencode:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm publish` fires opencode's prepack, which runs `bun run build` to
      # bundle the plugin and its shared modules into dist/.
      - uses: oven-sh/setup-bun@v2

      - name: Install opencode deps
        working-directory: opencode
        run: bun install --frozen-lockfile

      - run: npm install -g npm@latest

      - name: Check if akm-opencode version already exists
        id: npm_version
        working-directory: opencode
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if npm view "akm-opencode@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive npm publish args
        id: publish_args
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          PUBLISH_ARGS="--provenance --access public"

          if [ "$NEXT" = "true" ]; then
            PUBLISH_ARGS="$PUBLISH_ARGS --tag next"
          fi

          echo "publish_args=$PUBLISH_ARGS" >> "$GITHUB_OUTPUT"

      - name: Publish akm-opencode
        if: ${{ steps.npm_version.outputs.exists != 'true' }}
        working-directory: opencode
        run: npm publish ${{ steps.publish_args.outputs.publish_args }}

  github-release:
    needs: [version, publish-opencode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Create GitHub release
        run: |
          PRERELEASE=""
          if [ "${{ needs.version.outputs.next }}" = "true" ]; then
            PRERELEASE="--prerelease"
          fi

          if gh release view "${{ needs.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
