name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 or 1.2.3-beta.1). Bumps all packages, publishes opencode to npm, and creates a GitHub release."
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2

      - name: Install claude deps
        working-directory: claude
        run: bun install --frozen-lockfile

      - name: Install opencode deps
        working-directory: opencode
        run: bun install --frozen-lockfile

      - name: Install evals deps
        working-directory: evals
        run: bun install --frozen-lockfile

      - name: Typecheck claude plugin
        working-directory: claude
        run: bun run typecheck

      - name: Typecheck opencode plugin
        working-directory: opencode
        run: bun run typecheck

      - name: Run integration tests
        run: bun test tests/

      - name: Run tier-2 evals against checked-in baseline
        working-directory: evals
        run: bun tier2/runner.ts --baseline tier2/baseline/tier2.json --out ../eval-results/release

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      tag_exists: ${{ steps.tag.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fail before anything is written. The steps below stamp four manifests,
      # commit, and push a tag; npm is the first thing that would reject a bad
      # version, and by then the tag already exists. Two rules are checked:
      # the version must be plain semver (a four-component string such as
      # 0.9.0.20260811.1 is not, and the registry refuses it), and its
      # MAJOR.MINOR must match the akm line the plugins target — see the
      # versioning policy in tests/version-policy.test.ts.
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs')

          const version = process.env.VERSION.trim()
          const source = fs.readFileSync('claude/shared/akm-version.ts', 'utf8')
          const range = /AKM_VERSION_RANGE\s*=\s*"([^"]+)"/.exec(source)?.[1]
          if (!range) {
            console.error('Could not read AKM_VERSION_RANGE from claude/shared/akm-version.ts')
            process.exit(1)
          }

          const SEMVER = /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/
          const parsed = SEMVER.exec(version)
          if (!parsed) {
            console.error(`Version "${version}" is not valid semver (MAJOR.MINOR.PATCH[-prerelease][+build]).`)
            console.error('npm rejects anything else on publish, and this job tags before it publishes.')
            process.exit(1)
          }

          const floor = SEMVER.exec(range.replace(/^[\^~>=v\s]+/, ''))
          if (!floor) {
            console.error(`AKM_VERSION_RANGE "${range}" has no parseable floor; expected a caret range like ^0.9.0.`)
            process.exit(1)
          }

          const want = `${floor[1]}.${floor[2]}`
          const got = `${parsed[1]}.${parsed[2]}`
          if (got !== want) {
            console.error(`Version "${version}" is on the ${got} line but the plugins target akm ${range} (the ${want} line).`)
            console.error(`Release a ${want}.x version, or move AKM_VERSION_RANGE first if the plugins now target a new akm minor.`)
            process.exit(1)
          }

          console.log(`Version ${version} is valid semver on the ${got} line, matching akm ${range}.`)
          EOF

      - name: Bump versions
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="$VERSION" node <<'EOF'
          const fs = require('fs')

          const version = process.env.VERSION
          const updateJsonFile = (file, transform) => {
            const current = JSON.parse(fs.readFileSync(file, 'utf8'))
            const next = transform(current)
            fs.writeFileSync(file, `${JSON.stringify(next, null, 2)}\n`)
          }

          updateJsonFile('opencode/package.json', (pkg) => ({ ...pkg, version }))
          updateJsonFile('claude/package.json', (pkg) => ({ ...pkg, version }))
          updateJsonFile('claude/.claude-plugin/plugin.json', (plugin) => ({ ...plugin, version }))
          updateJsonFile('.claude-plugin/marketplace.json', (marketplace) => ({
            ...marketplace,
            plugins: marketplace.plugins.map((plugin, index) => index === 0 ? { ...plugin, version } : plugin),
          }))
          EOF

      - name: Commit and tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude/package.json opencode/package.json claude/.claude-plugin/plugin.json .claude-plugin/marketplace.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ inputs.version }}"
            git push
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            git tag "v${{ inputs.version }}"
            git push origin "v${{ inputs.version }}"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  publish-opencode:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: Check if akm-opencode version already exists
        id: npm_version
        working-directory: opencode
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if npm view "akm-opencode@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive npm publish args
        id: publish_args
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PUBLISH_ARGS="--provenance --access public"
          NPM_TAG=$(VERSION="$VERSION" node -p "const version = process.env.VERSION; const prerelease = version.match(/^\d+\.\d+\.\d+-([0-9A-Za-z.-]+)$/)?.[1] ?? ''; if (!prerelease) { '' } else if (/^(beta|rc)(?:[.-]?\d.*)?$/i.test(prerelease)) { 'next' } else { prerelease.split(/[.-]/)[0] }")

          if [ -n "$NPM_TAG" ]; then
            PUBLISH_ARGS="$PUBLISH_ARGS --tag $NPM_TAG"
          fi

          echo "publish_args=$PUBLISH_ARGS" >> "$GITHUB_OUTPUT"

      - name: Publish akm-opencode
        if: ${{ steps.npm_version.outputs.exists != 'true' }}
        working-directory: opencode
        run: npm publish ${{ steps.publish_args.outputs.publish_args }}

  github-release:
    needs: [version, publish-opencode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Create GitHub release
        run: |
          if gh release view "${{ needs.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
