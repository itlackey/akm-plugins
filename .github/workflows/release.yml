name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 or 1.2.3-beta.1). Bumps all packages, publishes opencode to npm, and creates a GitHub release."
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: opencode
        run: bun install

      - name: Run integration tests
        run: bun test tests/

      - name: Run tier-2 evals against checked-in baseline
        working-directory: evals
        run: bun tier2/runner.ts --baseline tier2/baseline/tier2.json --out ../eval-results/release

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      tag_exists: ${{ steps.tag.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump versions
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="$VERSION" node <<'EOF'
          const fs = require('fs')

          const version = process.env.VERSION
          const updateJsonFile = (file, transform) => {
            const current = JSON.parse(fs.readFileSync(file, 'utf8'))
            const next = transform(current)
            fs.writeFileSync(file, `${JSON.stringify(next, null, 2)}\n`)
          }

          updateJsonFile('opencode/package.json', (pkg) => ({ ...pkg, version }))
          updateJsonFile('claude/package.json', (pkg) => ({ ...pkg, version }))
          updateJsonFile('claude/.claude-plugin/plugin.json', (plugin) => ({ ...plugin, version }))
          updateJsonFile('.claude-plugin/marketplace.json', (marketplace) => ({
            ...marketplace,
            plugins: marketplace.plugins.map((plugin, index) => index === 0 ? { ...plugin, version } : plugin),
          }))
          EOF

      - name: Commit and tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude/package.json opencode/package.json claude/.claude-plugin/plugin.json .claude-plugin/marketplace.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ inputs.version }}"
            git push
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            git tag "v${{ inputs.version }}"
            git push origin "v${{ inputs.version }}"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  publish-opencode:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - name: Check if akm-opencode version already exists
        id: npm_version
        working-directory: opencode
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if npm view "akm-opencode@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive npm publish args
        id: publish_args
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PUBLISH_ARGS="--provenance --access public"
          NPM_TAG=$(VERSION="$VERSION" node -p "const version = process.env.VERSION; const prerelease = version.match(/^\d+\.\d+\.\d+-([0-9A-Za-z.-]+)$/)?.[1] ?? ''; if (!prerelease) { '' } else if (/^(beta|rc)(?:[.-]?\d.*)?$/i.test(prerelease)) { 'next' } else { prerelease.split(/[.-]/)[0] }")

          if [ -n "$NPM_TAG" ]; then
            PUBLISH_ARGS="$PUBLISH_ARGS --tag $NPM_TAG"
          fi

          echo "publish_args=$PUBLISH_ARGS" >> "$GITHUB_OUTPUT"

      - name: Publish akm-opencode
        if: ${{ steps.npm_version.outputs.exists != 'true' }}
        working-directory: opencode
        run: npm publish ${{ steps.publish_args.outputs.publish_args }}

  github-release:
    needs: [version, publish-opencode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Create GitHub release
        run: |
          if gh release view "${{ needs.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
